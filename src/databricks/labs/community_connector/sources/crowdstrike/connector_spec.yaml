display_name: CrowdStrike Falcon
connection:
  parameters:
    - name: client_id
      type: string
      required: true
      secret: true
      description: CrowdStrike API client ID.
    - name: client_secret
      type: string
      required: true
      secret: true
      description: CrowdStrike API client secret.
    - name: base_url
      type: string
      required: false
      description: Falcon API base URL.
    - name: token_url
      type: string
      required: false
      description: OAuth token URL.
    - name: scope
      type: string
      required: false
      description: Optional OAuth scope for token request.
    - name: page_size
      type: string
      required: false
      description: Page size used for paginated collection reads.
    - name: timeout_seconds
      type: string
      required: false
      description: HTTP timeout in seconds.
external_options_allowlist: "offset,limit,cursor_after"
