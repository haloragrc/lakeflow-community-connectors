endpoints:
  - path: /api/v1/deployments/{deployment_slug}
    method: GET
    corpus: deployment
    response:
      single_entity: true
      pagination_style: none

  - path: /api/v1/deployments/{deployment_slug}/projects
    method: GET
    corpus: projects
    response:
      pagination_style: none
      wrapper:
        records_key: projects

  - path: /api/v1/deployments/{deployment_slug}/findings
    method: GET
    corpus: findings
    response:
      pagination_style: none
      wrapper:
        records_key: findings

  - path: /api/v1/deployments/{deployment_slug}/scans
    method: GET
    corpus: scans
    response:
      pagination_style: none
      wrapper:
        records_key: scans
