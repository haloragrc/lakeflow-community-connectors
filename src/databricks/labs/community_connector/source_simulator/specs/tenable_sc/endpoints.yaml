      pagination_style: none
      wrapper:
        records_key: response.usable

  - path: /rest/repository
    method: GET
    corpus: repositories
    response:
      pagination_style: none
      wrapper:
        records_key: response.usable

  - path: /rest/vuln
    method: GET
